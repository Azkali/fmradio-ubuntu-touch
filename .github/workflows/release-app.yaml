name: "release-app"
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[a-z]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[a-z]+.[0-9]+'

jobs:
  create-release:
    permissions: write-all
    environment: FMRadio Release
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.step1.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: step1
        uses: ncipollo/release-action@v1
        with:
          name: "Volla FM Radio for Ubuntu Touch ${{ github.ref_name }}"
          body: |
            See the assets to download this version and install.

          draft: false
          prerelease: false
          allowUpdates: true

  build-app:
    permissions: write-all
    runs-on: ubuntu-24.04-arm
    environment: FMRadio Release
    needs: create-release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag v1.2.3 -> 1.2.3, v1.2.3-beta.1 -> 1.2.3~beta.1 (Debian/click ordering puts
      # pre-releases before the final release). Manual runs on a branch get
      # <last tag>+git<sha>.
      - name: Compute version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            VERSION="${LAST_TAG#v}+git$(git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION/-/\~}"
          echo "Click version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dpkg-dev pipx
          pipx install clickable-ut

      - name: Build click
        env:
          CLICKABLE_DOCKER_COMMAND: docker
          CLICKABLE_BUILD_ARGS: -DAPP_VERSION=${{ steps.version.outputs.version }}
        run: |
          clickable build --arch arm64

      - name: Upload click to release
        uses: AButler/upload-release-assets@v3.0
        with:
          files: "build/aarch64-linux-gnu/app/*.click"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ needs.create-release.outputs.releaseId }}
